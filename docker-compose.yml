services:
  postgres:
    image: postgres:17-alpine
    container_name: budget-forge-db
    environment:
      POSTGRES_USER: budgetforge
      POSTGRES_PASSWORD: budgetforge
      POSTGRES_DB: budgetforge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budgetforge']
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
